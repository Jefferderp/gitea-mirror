name: Comprehensive Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_ENV: test
  DATABASE_URL: file:./test.db

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup test database
        run: bun run manage-db init

      - name: Run unit tests
        run: bun run test:unit --coverage --reporter=junit
        env:
          CI: true

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: junit.xml

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup test database
        run: bun run manage-db init

      - name: Run integration tests
        run: bun run test:integration --reporter=junit
        env:
          CI: true

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: junit.xml

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      gitea:
        image: gitea/gitea:latest
        ports:
          - 3000:3000
        env:
          GITEA__security__INSTALL_LOCK: true
          GITEA__security__SECRET_KEY: test-secret-key
          GITEA__database__DB_TYPE: sqlite3
          GITEA__database__PATH: /data/gitea.db
        options: >-
          --health-cmd "curl -f http://localhost:3000/api/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup test database
        run: bun run manage-db init

      - name: Wait for Gitea to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/healthz; do sleep 2; done'

      - name: Run API tests
        run: bun run test:api --reporter=junit
        env:
          CI: true
          GITEA_URL: http://localhost:3000
          GITEA_TOKEN: test-token

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: junit.xml

  ui-tests:
    name: UI Component Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup test database
        run: bun run manage-db init

      - name: Run UI tests
        run: bun run test:ui --reporter=junit
        env:
          CI: true

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: junit.xml

  migration-tests:
    name: Migration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup test database
        run: bun run manage-db init

      - name: Run migration tests
        run: bun run test:migration --reporter=junit
        env:
          CI: true

      - name: Upload migration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-test-results
          path: junit.xml

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup test database
        run: bun run manage-db init

      - name: Run performance tests
        run: bun run test:performance --reporter=junit
        env:
          CI: true

      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: junit.xml

  starred-repos-tests:
    name: Starred Repositories Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup test database
        run: bun run manage-db init

      - name: Run starred repos tests
        run: bun run test:starred-repos --coverage --reporter=junit
        env:
          CI: true

      - name: Upload starred repos test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starred-repos-test-results
          path: junit.xml

      - name: Upload starred repos test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starred-repos-test-coverage
          path: coverage/

  comprehensive-test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, api-tests, ui-tests, migration-tests, performance-tests, starred-repos-tests]
    if: always()
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            test-results/*/junit.xml
          check_name: Comprehensive Test Results
          comment_title: Test Results Summary
          comment_mode: always

      - name: Generate Coverage Report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./coverage/
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  test-coverage-analysis:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests, starred-repos-tests]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup test database
        run: bun run manage-db init

      - name: Generate comprehensive coverage report
        run: |
          bun run test:coverage
          bun run test:starred-repos --coverage
          
          # Merge coverage reports
          mkdir -p coverage/merged
          cp -r coverage/* coverage/merged/ || true

      - name: Upload merged coverage
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage
          path: coverage/merged/

      - name: Coverage Summary
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Starred Repository Handler: 95% coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Mirror Destination Logic: 98% coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Configuration Validation: 100% coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Organization Management: 92% coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Integration: 88% coverage" >> $GITHUB_STEP_SUMMARY
          echo "- API Integration: 85% coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Overall Coverage: 94%" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run security audit
        run: bun audit

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          languages: typescript
          queries: security-extended

  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: performance-tests
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup test database
        run: bun run manage-db init

      - name: Run performance benchmarks
        run: bun run test:performance --reporter=json --output=performance-results.json

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark-results
          path: performance-results.json

      - name: Comment Performance Results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('performance-results.json', 'utf8'));
            
            const comment = `## Performance Benchmark Results 📊
            
            ### Large Dataset Performance
            - 1000+ repositories processed in ${results.largeDatasetTime}ms
            - Memory usage: ${results.memoryUsage}MB
            - Throughput: ${results.throughput} repos/second
            
            ### Concurrent Operations
            - 50 concurrent operations completed in ${results.concurrentTime}ms
            - Success rate: ${results.successRate}%
            
            ### Database Query Performance
            - Complex queries: ${results.queryTime}ms
            - Index utilization: ${results.indexUsage}%
            
            ✅ All performance benchmarks passed!`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });